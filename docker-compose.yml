services:
  chrome-webdriver:
    image: selenium/standalone-chrome
    ports:
      - "4444:4444"
    networks:
      - tdd

  gui:
    build:
      context: .
      dockerfile: src/main/resources/docker/Dockerfile.gui
    ports:
      - "8080:80"
    networks:
      - tdd

  acceptance-testing:
    build:
      context: .
      dockerfile: src/acceptance/resources/docker/Dockerfile.acceptance
    depends_on:
      - chrome-webdriver
      - gui
    networks:
      - tdd

networks:
  tdd:
    driver: bridge
